<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Embed</title>
</head>
<body style="margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#121212;">

  <!-- Spotify Embed -->
  <iframe
    src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M"
    width="400"
    height="480"
    frameborder="0"
    allowfullscreen=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy">
  </iframe>

</body>
