<!DOCTYPE html>
<html>
<head>
  <title>Spotify Web App</title>

  <style>
    body {
      font-family: Arial;
      background: #121212;
      color: white;
      text-align: center;
      padding: 30px;
    }

    button {
      background: #1DB954;
      border: none;
      padding: 12px 24px;
      color: white;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
    }

    input {
      padding: 12px;
      width: 500px;
      border-radius: 8px;
      border: none;
      margin-top: 20px;
      font-size: 16px;
    }

    #player {
      margin-top: 30px;
    }

    iframe {
      border-radius: 16px;
      width: 90vw;
      max-width: 1200px;
      height: 700px;
      border: none;
    }
  </style>
</head>

<body>

  <h1>Spotify Player</h1>

  <!-- Login Button -->
  <button onclick="loginSpotify()">
    Login with Spotify
  </button>

  <br><br>

  <!-- Spotify URL -->
  <input
    type="text"
    id="spotifyUrl"
    placeholder="Paste Spotify playlist / song / album URL"
  >

  <br>

  <!-- Load Music -->
  <button onclick="loadSpotify()">
    Load Music
  </button>

  <!-- Open In New Tab -->
  <button onclick="openInNewTab()">
    Open Player In New Tab
  </button>

  <!-- Player -->
  <div id="player"></div>

  <script>

    // Spotify OAuth Login
    function loginSpotify() {

      const clientId = "YOUR_CLIENT_ID";

      const redirectUri = window.location.href;

      const scopes = [
        "user-read-private",
        "playlist-read-private",
        "streaming"
      ];

      const authUrl =
        `https://accounts.spotify.com/authorize` +
        `?response_type=token` +
        `&client_id=${clientId}` +
        `&scope=${encodeURIComponent(scopes.join(" "))}` +
        `&redirect_uri=${encodeURIComponent(redirectUri)}`;

      window.location.href = authUrl;
    }

    // Load Spotify Embed
    function loadSpotify() {

      const url =
        document.getElementById("spotifyUrl").value;

      let embedUrl = url.replace(
        "open.spotify.com/",
        "open.spotify.com/embed/"
      );

      document.getElementById("player").innerHTML = `
        <iframe
          src="${embedUrl}"
          allowfullscreen
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>
      `;
    }

    // Open Full Player In New Tab
    function openInNewTab() {

      const url =
        document.getElementById("spotifyUrl").value;

      let embedUrl = url.replace(
        "open.spotify.com/",
        "open.spotify.com/embed/"
      );

      const newWindow = window.open("", "_blank");

      newWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Spotify Player</title>

          <style>
            body {
              margin: 0;
              background: #121212;
              display: flex;
              justify-content: center;
              align-items: center;
              height: 100vh;
            }

            iframe {
              width: 100vw;
              height: 100vh;
              border: none;
            }
          </style>
        </head>

        <body>

          <iframe
            src="${embedUrl}"
            allowfullscreen
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
          </iframe>

        </body>
        </html>
      `);

      newWindow.document.close();
    }

  </script>

</body>
</html>
